# Editor completions
"$schema" = "https://starship.rs/config-schema.json"

format = """
$all\
$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$shell\
$character"""

# Newline between prompts
add_newline = false

right_format = "$time"

# Enable kubernetes module
[kubernetes]
disabled = false
symbol = "󱃾 "

[gcloud]
symbol = "󱇶 "

[aws]
disabled = true

[time]
disabled = false
style = "dimmed"
format = "[at $time]($style)"
