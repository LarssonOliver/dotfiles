# Setup colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Mouse support
set -g mouse on

# Set prefix key
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start window numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Set vi-mode
set-window-option -g mode-keys vi

# Yanking keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# Highlight windows where Claude Code is waiting for input (set by
# claude/hooks/tmux-waiting.sh). Mirrors the nord plugin's window formats with
# the background swapped to nord yellow; must come after the plugin is loaded.
set -g window-status-format "#[fg=black,bg=#{?@claude_waiting,yellow,brightblack},nobold,noitalics,nounderscore] #[fg=#{?@claude_waiting,black,white},bg=#{?@claude_waiting,yellow,brightblack}]#I #[nobold,noitalics,nounderscore] #[fg=#{?@claude_waiting,black,white}]#W #F #[fg=#{?@claude_waiting,yellow,brightblack},bg=black,nobold,noitalics,nounderscore]"

# Clear the Claude highlight once the window is looked at. pane-focus-in needs
# focus-events (enabled by tmux-sensible).
set-hook -g after-select-window 'set-option -wu @claude_waiting'
set-hook -g pane-focus-in 'set-option -wu @claude_waiting'
