---
# For config instructions, see https://github.com/anishathalye/dotbot

- defaults:
    link:
      relink: true
      create: true

- clean: ["~", "~/.config"]

- shell:
  - command: bash pre-install.sh 
    description: Running pre installation script
    stdout: true
    stderr: true

- create:
    ~/dev:

- link:
    ~/.config/gtk-3.0:
      path: config/gtk-3.0
      if: '! ./is-headless.sh'
    ~/.config/gtk-4.0:
      path: config/gtk-3.0
      if: '! ./is-headless.sh'
    ~/.gtkrc-2.0:
      path: gtkrc-2.0
      if: '! ./is-headless.sh'
    ~/.config/i3:
      path: config/i3
      if: '! ./is-headless.sh'
    ~/.config/i3blocks:
      path: config/i3blocks
      if: '! ./is-headless.sh'
    ~/.config/picom.conf:
      path: config/picom.conf
      if: '! ./is-headless.sh'
    ~/.config/starship.toml: config/starship.toml
    ~/.config/dunst:
      path: config/dunst
      if: '! ./is-headless.sh'
    ~/.config/nvim: config/nvim
    ~/.config/zathura:
      path: config/zathura
      if: '! ./is-headless.sh'
    ~/.config/fontconfig:
      path: config/fontconfig
      if: '! ./is-headless.sh'
    ~/.config/k9s: config/k9s
    ~/.config/sofka: config/sofka
    ~/.config/ghostty:
      path: config/ghostty
      if: '! ./is-headless.sh'
    ~/.config/aerospace:
      path: config/aerospace
      if: '[ `uname` = Darwin ]'

    ~/.config/atuin: 
      path: config/atuin
      force: true

    ~/.vimrc: vimrc

    ~/.tmux: tmux
    ~/.config/tmux/tmux.conf: config/tmux/tmux.conf

    ~/.config/alacritty/:
      glob: true
      path: config/alacritty/*
      exclude:
        - config/alacritty/darwin.toml
      if: '! ./is-headless.sh'

    ~/.config/alacritty/darwin.toml:
      path: config/alacritty/darwin.toml
      if: '[ `uname` = Darwin ]'

    ~/.local/share/wallpaper/:
      path: local/share/wallpaper/*
      glob: true
      if: '! ./is-headless.sh'

    ~/.local/share/icons/dotfiles.png:
      path: local/share/icons/dotfiles.png
      if: '! ./is-headless.sh'
    ~/.local/bin/:
      path: local/bin/*
      glob: true

    ~/.ssh/config: ssh/config
    ~/.gitconfig: gitconfig

    ~/.shell: shell

    ~/.bash_profile: 
      path: bash_profile
      force: true
    ~/.bashrc:
      path: bashrc
      force: true
    ~/.bash: bash

    ~/.zshrc: 
      path: zshrc
      force: true
    ~/.oh-my-zsh/custom/plugins/:
      glob: true
      path: zsh/plugins/*
    ~/.zsh/:
      glob: true
      path: zsh/*
      exclude:
        - zsh/plugins

    ~/.claude/CLAUDE.md: claude/CLAUDE.md

- shell:
  - command: sh post-install.sh
    description: Running post installation script]
    stdout: true
    stderr: true
